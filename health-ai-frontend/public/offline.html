<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Health AI Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #111827;
        --brand: #10b981;
        --muted: #9aa7b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top, #111827 0%, var(--bg) 50%);
        color: #e5edf7;
      }
      .card {
        width: min(440px, calc(100vw - 32px));
        padding: 32px 24px;
        text-align: center;
        border-radius: 24px;
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2);
      }
      .badge {
        display: inline-flex;
        width: 64px;
        height: 64px;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: rgba(16, 185, 129, 0.12);
        font-size: 2rem;
      }
      h1 { margin: 18px 0 8px; font-size: clamp(1.6rem, 4vw, 2.3rem); }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      .meta { margin-top: 18px; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">📶</div>
      <h1>You are offline</h1>
      <p>Health AI is cached for later, but a connection is required for live health data and updates.</p>
      <p class="meta">Reconnect to sync your plan and continue using the app.</p>
    </main>
  </body>
</html>
