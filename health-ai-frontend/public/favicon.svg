<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="#10B981" stroke-opacity="0.25" stroke-width="8" />

  <!-- Outer Pulse Circle -->
  <circle cx="256" cy="256" r="190" stroke="url(#emerald-grad)" stroke-opacity="0.2" stroke-width="12" stroke-dasharray="16 12" />

  <!-- Heart with Pulse Line -->
  <g filter="url(#glow)">
    <path fill="url(#emerald-grad)" d="M256 420c-12 0-224-136-224-244 0-66 52-116 118-116 46 0 88 25 106 64 18-39 60-64 106-64 66 0 118 50 118 116 0 108-212 244-224 244z" />
    
    <!-- Heart Beat Pulse Line (Cutout Overlay) -->
    <path stroke="#0B0F19" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" d="M120 256h70l26-45 38 90 32-60 22 25h84" />
    <path stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" d="M120 256h70l26-45 38 90 32-60 22 25h84" />
  </g>

  <!-- AI Sparkle Icon Top Right -->
  <path fill="#34D399" d="M390 100c10 25 25 40 50 50-25 10-40 25-50 50-10-25-25-40-50-50 25-10 40-25 50-50z" />
</svg>